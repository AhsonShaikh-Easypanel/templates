name: YourDrive
description:
  YourDrive is a self-hosted file manager that works like Google Drive, on your
  own object storage. Upload, organize into folders, preview, search, share and
  restore files from Trash, with a Media timeline for every photo and video.
  Files stay in your own bucket on AWS S3, Azure Blob, Cloudflare R2, Wasabi or
  any S3-compatible server. Free for up to 3 users; a Team license adds
  unlimited users, shared link passwords and expiry, upload requests and storage
  limits per user.
instructions: >-
  Open the app domain and register: the first account becomes the admin and is
  taken to the setup wizard to connect storage. With the bundled storage on,
  choose "Bundled storage": every field is filled in, so just test and save. To
  use AWS S3, Cloudflare R2, Wasabi or Azure Blob instead, turn off the bundled
  storage and enter your own bucket in the wizard. Uploads are limited to 500 MB
  per file. To update, back up the database, then set the same new version tag
  on both the frontend and backend images and redeploy; database migrations run
  automatically on start.
changeLog:
  - date: 2026-10-07
    description: First release
links:
  - label: Website
    url: https://yourdrive.app
  - label: Documentation
    url: https://yourdrive.app/docs
contributors:
  - name: Ahson Shaikh
    url: https://github.com/Ahson-Shaikh
schema:
  type: object
  required:
    - appServiceName
    - frontendServiceImage
    - backendServiceImage
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: yourdrive
    frontendServiceImage:
      type: string
      title: Frontend Image
      default: dockeriddonuts/yourdrive-frontend:0.3.3
    backendServiceImage:
      type: string
      title: Backend Image
      default: dockeriddonuts/yourdrive-backend:0.3.3
    bundledStorage:
      type: boolean
      title: Bundled S3 Storage
      description:
        Deploy a private SeaweedFS storage server in this project. Turn it off
        to use AWS S3, Cloudflare R2, Wasabi or Azure Blob.
      default: true
benefits:
  - title: Your Files, Your Bucket
    description:
      Files are stored in your own S3, R2, Wasabi or Azure bucket, never in a
      third-party service.
  - title: No Per-Seat Fees
    description:
      Free for up to 3 users. A Team license covers unlimited users on one
      server for $120 a year.
  - title: Familiar Drive Experience
    description:
      Folders, Starred, Trash, search and previews that work the way people
      already expect.
features:
  - title: My Drive Folders
    description:
      Nested folders for any file type, with drag and drop, bulk actions and
      search.
  - title: Media Timeline
    description:
      Every photo and video in one timeline grouped by month, with thumbnails
      and video posters.
  - title: Shared Links
    description:
      Share files and folders by link; Team adds passwords, expiry dates and
      upload requests.
  - title: Admin Controls
    description:
      User management, plus storage limits per user and a list of every shared
      link on Team.
tags:
  - File Manager
  - Cloud Storage
  - File Sharing
  - Photos
  - S3
  - Google Drive Alternative
